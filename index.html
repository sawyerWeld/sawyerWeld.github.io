<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sawyer Welden — software engineer and Pauper researcher.">
<meta name="theme-color" content="#f3f4f4">
<title>Sawyer Welden</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f4;
    --ink: #171817;
    --muted: #666b70;
    --faint: #a0a6aa;
    --line: #d7dcdf;
    --paper: #ffffff;
    --red: #b64f4a;
    --green: #4f8f5f;
    --blue: #386f9f;
    --gold: #c79834;
    --purple: #725a95;
  }

  * { box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
  }

  a { color: inherit; }

  .wrap {
    width: min(860px, calc(100vw - 32px));
    margin: 0 auto;
  }

  header {
    padding: 28px 0 18px;
  }

  h1 {
    margin: 0;
    font-size: 1.18rem;
    font-weight: 800;
    line-height: 1.1;
  }

  .dek {
    max-width: 560px;
    margin: 7px 0 0;
    color: #31373b;
    font-size: 0.88rem;
  }

  main {
    flex: 1;
    padding: 18px 0 42px;
    border-top: 1px solid var(--line);
  }

  .section-title {
    margin: 0 0 18px;
    color: #33383c;
    font-size: 0.86rem;
    font-weight: 800;
  }

  .links {
    display: grid;
    gap: 12px;
    max-width: 620px;
  }

  .entry {
    display: grid;
    grid-template-columns: 104px minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    min-height: 86px;
    padding: 8px 0;
    color: var(--ink);
    text-decoration: none;
  }

  .entry + .entry {
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .entry:hover .title,
  .entry:focus-visible .title {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }

  .entry:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 5px;
  }

  .thumb {
    position: relative;
    display: block;
    width: 104px;
    aspect-ratio: 1.72;
    overflow: hidden;
    border: 1px solid #2f3438;
    background: var(--paper);
  }

  .github-mark {
    display: grid;
    align-content: center;
    gap: 6px;
    padding: 12px;
    background: linear-gradient(180deg, #fbfcfc, #e9eef1);
  }

  .github-mark span {
    display: block;
    width: 78%;
    height: 3px;
    background: var(--ink);
  }

  .github-mark span:nth-child(2) {
    width: 54%;
    margin-left: 12px;
    background: var(--blue);
  }

  .github-mark span:nth-child(3) {
    width: 68%;
    background: var(--muted);
  }

  .pauper-mark {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    background:
      linear-gradient(150deg, rgba(56, 111, 159, 0.07), transparent 55%),
      var(--paper);
  }

  .pauper-mark span {
    width: 10px;
    border-radius: 1px 1px 0 0;
  }

  .pauper-mark span:nth-child(1) { height: 42%; background: var(--red); }
  .pauper-mark span:nth-child(2) { height: 74%; background: var(--blue); }
  .pauper-mark span:nth-child(3) { height: 57%; background: var(--gold); }
  .pauper-mark span:nth-child(4) { height: 88%; background: var(--green); }
  .pauper-mark span:nth-child(5) { height: 66%; background: var(--purple); }

  .entry-body { min-width: 0; }

  .title-line {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .title {
    margin: 0;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.18;
  }

  .badge {
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.58);
    color: #444a4f;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
  }

  .meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 700;
  }

  .arrow {
    color: var(--faint);
    font-size: 1.1rem;
  }

  footer {
    padding: 20px 0 34px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 780px) {
    .wrap { width: min(calc(100vw - 22px), 860px); }
    header { padding-bottom: 24px; }
    .dek { font-size: 0.93rem; }
    main { padding-top: 12px; }
    .links { gap: 10px; }
    .entry {
      grid-template-columns: 82px minmax(0, 1fr) auto;
      gap: 12px;
      min-height: 74px;
    }
    .thumb { width: 82px; }
  }

  @media (max-width: 380px) {
    .badge { display: none; }
    .meta { font-size: 0.72rem; }
    .arrow { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Sawyer Welden</h1>
    <p class="dek">Software, data, and Pauper research.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <h2 class="section-title">Links</h2>
    <nav class="links" aria-label="Featured links">
      <a class="entry" href="https://github.com/sawyerWeld" rel="me">
        <span class="thumb github-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="entry-body">
          <span class="title-line">
            <span class="title">GitHub</span>
            <span class="badge">External</span>
          </span>
          <span class="meta">Code, research, and experiments</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="entry" href="/pauper/">
        <span class="thumb pauper-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </span>
        <span class="entry-body">
          <span class="title-line">
            <span class="title">Pauper</span>
          </span>
          <span class="meta">Tournament reports, metagame visualizations, and tools</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </div>
</main>

<footer>
  <div class="wrap">Durham, North Carolina</div>
</footer>
</body>
</html>
