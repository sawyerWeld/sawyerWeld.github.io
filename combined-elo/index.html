<style>:root {
  --font-family: -apple-system, system-ui, sans-serif;
  --max-width: 70rem;
  --nav-link-color: #BBB;
  --nav-link-hover-color: #FFF;
  --button-color: #00713D;
  --button-hover-color: #069654;
  --table-alt-color: #E8FAEA;
}

* {
  box-sizing: border-box;
}

html,
body {
  padding: 0;
  margin: 0 auto;
  font-family: var(--font-family);
}
html {
  overflow-y: scroll;
}
body {
  display: flex;
  flex-direction: column;
}

strong {
  font-weight: 550;
}

h1, h2 {
  font-weight: 550;
}

h2 {
  font-size: 1.75rem;
  margin-top: 0.4rem;
  margin-bottom: 0.4rem;
  text-wrap: balance;
}

p {
  margin: 0;
  margin-top: 0.2rem;
  margin-bottom: 0.2rem;
  text-wrap: pretty;
}

a {
  color: blue;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

ul {
  margin-top: 0.2rem;
  margin-bottom: 0.2rem;
}

table {
  border-collapse: collapse;
  width: max-content;
}

.tableDiv {
  overflow-x: scroll;
  padding-bottom: 1rem;
}

td, th {
  padding: .3rem .5rem;
}

td {
  border: 1px solid #ccc;
  text-align: right;
}

.align-left {
  text-align: left;
}

th {
  text-align: right;
  font-weight: 550;
  color: var(--nav-link-color);
  background-color: black;
  border: 1px solid black;
}

.sort {
  transition: color 0.2s ease;
}

.sort:hover {
  color: var(--nav-link-hover-color);
  cursor: pointer;
}

tbody tr:nth-child(even) {
  background-color: var(--table-alt-color);
}

.sort.asc::after {
  content: "\002B06";
  padding-left: 3px;
}
.sort.desc::after {
  content: "\002B07";
  padding-left: 3px
}

.search {
  font-size:1.2rem;
  margin-bottom: 0.5rem;
  width: 12rem;
}

.headline {
  font-size: 4rem;
  margin-bottom: 1rem;
  margin-top: 1rem;
  line-height: 1.2;
}

.sub-headline {
  font-size: 1.5rem;
  margin-top: 0.25rem;
  margin-bottom: 1rem;
  text-wrap: balance;
  text-align: center;
}

header {
  box-shadow: 0px 1px 1px #999;
  width: 100%;
  background-color: black;
}

footer {
  box-shadow: 0px -1px 1px #999;
  width: 100%;
  padding-top: 1rem;
  margin-top: 0.8rem;
  margin-bottom: 1rem;
}

.flex-column {
  display: flex;
  flex-direction: column;
}

.flex-row {
  display: flex;
  flex-direction: row;
}

.container {
  margin-inline: auto;
  max-width: var(--max-width);
}

.center-aligned {
  align-items: center;
}

.spread-content {
  justify-content: space-between;
}

.button-span {
  gap: 1.6rem;
}

.media-span {
  gap: 0.5rem;
}

.navbar {
  justify-content: space-between;
  padding: 0.75rem;
  flex-wrap: wrap;
  gap: 12px;
}

@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    gap: 12px;
  }
}

a.navbar-link {
  font-size: 1rem;
  color: var(--nav-link-color);
  transition: color 0.2s ease;
  text-decoration: none;
}

a.navbar-link:hover,
a.navbar-link[aria-current="page"] {
  text-decoration: none;
  color: var(--nav-link-hover-color);
}

a.navbar-home {
  font-size: 1.5rem;
  text-decoration: none;
  color: white;
}

a.media-link {
  padding: 0.4rem 0.4rem;
  padding-bottom: 0.1rem;
  border-radius: 8px;
  transition: background-color 0.2s ease;
}

a.media-link:hover {
  background-color: #EEE;
}

.navbar-container {
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 18px;
}

@media (max-width: 600px) {
  .navbar-container {
    justify-content: center;
  }

  a.navbar-home {
    font-size: 1.2rem;
  }
}

section {
  display: flex;
  flex-direction: column;
  padding-left: 1rem;
  padding-right: 1rem;
  margin-top: 0.6rem;
  margin-bottom: 0.6rem;
}

.button {
  text-decoration: none;
  text-align:center;
  background-color: var(--button-color);
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  transition: background-color 0.2s ease;
}

.button:hover {
  text-decoration: none;
  background-color: var(--button-hover-color);
}

.button-text-span {
  gap: 0.3rem;
}

@media (max-width: 450px) {
  .button-text-span {
    flex-direction: column;
  }
}

.image {
  width: 50%;
  align-self: center;
  margin-top: 1rem;
  margin-bottom: 1rem;
}

@media (max-width: 600px) {
  .dragonImage {
    width: 75%;
  }
}</style>

<header><nav class="container navbar flex-row" aria-label="League stats">
<a class="navbar-home" href="/ppl/">Piedmont Pauper League</a>
<div class="navbar-container flex-row"><a class="navbar-link" href="/season-standings/">Standings</a><a class="navbar-link" href="/combined-elo/" aria-current="page">Elo</a><a class="navbar-link" href="/ppl/player.html">Players</a><a class="navbar-link" href="/ppl/store.html">Stores</a><a class="navbar-link" href="/ppl/metagame.html">Metagame</a></div></nav></header>
<main><div class="container">

<div class="league-page ui-root">
  <noscript
    ><p>
      This explorer needs JavaScript to display the league results.
    </p></noscript
  >
  <div class="store-filter">
    <div class="ui-segmented" role="group" aria-label="Store">
      <button data-store="all" aria-pressed="true">All stores</button
      ><button data-store="15582" aria-pressed="false">Dragon’s Hoard</button
      ><button data-store="7679" aria-pressed="false">Atomic Empire</button>
    </div>
  </div>
  <section id="elo" aria-labelledby="elo-title">
    <div class="section-head ui-toolbar">
      <h2 id="elo-title">Combined Elo</h2>
      <div class="refresh-tools">
        <span id="data-notice" hidden></span
        ><button id="refresh-data" type="button" disabled>Loading…</button>
      </div>
    </div>
    <div class="explorer ui-panel">
      <div class="plot-area">
        <div class="plot-tools">
          <div class="ui-segmented" role="group" aria-label="Chart detail">
            <button id="event-view" aria-pressed="false">By event</button
            ><button id="round-view" aria-pressed="true">By round</button>
          </div>
          <div class="ui-segmented" role="group" aria-label="Player visibility">
            <button data-top="5" aria-pressed="true">Top 5</button
            ><button data-top="10" aria-pressed="false">Top 10</button
            ><button data-top="15" aria-pressed="false">Top 15</button>
          </div>
        </div>
        <div id="chart-wrap">
          <svg
            id="chart"
            role="group"
            aria-label="Interactive Elo history"
          ></svg>
        </div>
        <div id="inspection" class="inspection" aria-live="polite" hidden></div>
      </div>
    </div>
  </section>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <div class="section-head ui-toolbar">
      <h2 id="leaderboard-title">Elo leaderboard</h2>
    </div>
    <div class="panel">
      <div class="table-scroll">
        <table class="elo-table">
          <caption class="sr-only">
            All players ranked by current Elo
          </caption>
          <thead>
            <tr>
              <th scope="col">Overall rank</th>
              <th scope="col">Player</th>
              <th scope="col">Elo</th>
              <th scope="col">Δ last event</th>
              <th
                scope="col"
                title="Tournament match points: 3 per win, 1 per draw; includes byes"
              >
                Points
              </th>
              <th scope="col">Matches</th>
              <th scope="col">W–L–D</th>
            </tr>
          </thead>
          <tbody id="elo-rows"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span id="page-range" aria-live="polite"></span>
        <div>
          <button id="previous-page" aria-label="Previous leaderboard page">
            Previous</button
          ><button id="next-page" aria-label="Next leaderboard page">
            Next
          </button>
        </div>
      </div>
    </div>
  </section>
  <div class="sr-only" id="status" role="status"></div>
</div>
