* {

}

html,
body {
  padding: 0;
  margin: 0 auto;

html {
  overflow-y: scroll;
}
body {
  display: flex;
  flex-direction: column;
}

strong {
  font-weight: 550;
}

h1, h2 {
  font-weight: 550;
}

h2 {
  font-size: 1.75rem;
  margin-top: 0.4rem;
  margin-bottom: 0.4rem;

}

p {
  margin: 0;
  margin-top: 0.2rem;

a {

}

ul {
  margin-top: 0.2rem;
  margin-bottom: 0.2rem;
}

table {
  border-collapse: collapse;
  width: max-content;
}

.tableDiv {
  overflow-x: scroll;
  padding-bottom: 1rem;
}

td, th {
  padding: .3rem .5rem;
}

td {
  border: 1px solid #ccc;
  text-align: right;
}

.align-left {
  text-align: left;
}

th {
  text-align: right;
  font-weight: 550;
  color: var(--nav-link-color);
  background-color: black;
  border: 1px solid black;
}

.sort {
  transition: color 0.2s ease;
}

.sort:hover {
  color: var(--nav-link-hover-color);
  cursor: pointer;
}

tbody tr:nth-child(even) {
  background-color: var(--table-alt-color);
}

.sort.asc::after {
  content: "\002B06";
  padding-left: 3px;
}
.sort.desc::after {
  content: "\002B07";
  padding-left: 3px

.search {
  font-size:1.2rem;
  margin-bottom: 0.5rem;

}

.headline {
  font-size: 4rem;
  margin-bottom: 1rem;
  margin-top: 1rem;
  line-height: 1.2;
}

.sub-headline {
  font-size: 1.5rem;
  margin-top: 0.25rem;
  margin-bottom: 1rem;
  text-wrap: balance;
  text-align: center;
}

header {
  box-shadow: 0px 1px 1px #999;
  width: 100%;
  background-color: black;
}

footer {
  box-shadow: 0px -1px 1px #999;
  width: 100%;
  padding-top: 1rem;
  margin-top: 0.8rem;
  margin-bottom: 1rem;
}

.flex-column {
  display: flex;
  flex-direction: column;
}

.flex-row {
  display: flex;
  flex-direction: row;
}

  margin-inline: auto;
  max-width: var(--max-width);

.center-aligned {
  align-items: center;

}

.button-span {

.media-span {
  gap: 0.5rem;

.navbar {
  justify-content: space-between;

  gap: 12px;
}

@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    gap: 12px;

a.navbar-link {
  font-size: 1rem;
  color: var(--nav-link-color);
  transition: color 0.2s ease;
  text-decoration: none;
}

a.navbar-link:hover,
a.navbar-link[aria-current="page"] {
  text-decoration: none;
  color: var(--nav-link-hover-color);
}

a.navbar-home {
  font-size: 1.5rem;

}

.navbar-container {
  align-items: center;

}

  .navbar-container {
    justify-content: center;
  }

  a.navbar-home {
    font-size: 1.2rem;
  }
}

section {

  margin-top: 1rem;

</head><body class="stats-page">
<header><nav class="container navbar flex-row" aria-label="League stats">
<a class="navbar-home" href="/ppl/">Piedmont Pauper League</a>
<div class="navbar-container flex-row"><a class="navbar-link" href="/season-standings/">Standings</a><a class="navbar-link" href="/combined-elo/">Elo</a><a class="navbar-link" href="/ppl/player.html">Players</a><a class="navbar-link" href="/ppl/store.html">Stores</a><a class="navbar-link" href="/ppl/metagame.html" aria-current="page">Metagame</a></div></nav></header>
<main><div class="container">
<div class="league-page">
      <h1>Overall metagame</h1>
      <form id="filters">
        <label
          >Store<select id="store">
            <option value="all">All stores</option>
          </select></label
        ><label>From<input id="from" type="date" /></label
        ><label>Through<input id="to" type="date" /></label
        ><label
          >Events<select id="kind">
            <option value="all">All events</option>
            <option value="fnm">FNM only</option>
          </select></label
        ><button type="reset">Reset</button>
      </form>
      <p id="date-error" role="alert" hidden>Choose an end date on or after the start date.</p>
      <section>
        <div class="section-head">
          <h2>Archetypes</h2>
          <label
            ><span class="sr-only">Sort archetypes</span
            ><select id="sort">
              <option value="popularity">Most played</option>
              <option value="winRate">Win rate</option>
              <option value="name">Name</option>
            </select></label
          >
        </div>
        <div class="scroll">
          <table class="archetype-table">
            <colgroup>
              <col class="archetype-name-column" />
              <col class="archetype-count-column" />
              <col class="archetype-share-column" />
              <col class="archetype-count-column" />
              <col class="archetype-record-column" />
              <col class="archetype-rate-column" />
            </colgroup>
            <thead>
              <tr>
                <th>Archetype</th>
                <th>Entries</th>
                <th>Share</th>
                <th>Players</th>
                <th>W–L–D</th>
                <th>Win rate</th>
              </tr>
            </thead>
            <tbody id="archetypes"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="page-count"></span>
          <div>
            <button id="previous" aria-label="Previous archetypes">←</button
            ><button id="next" aria-label="Next archetypes">→</button>
          </div>
        </div>
      </section>
      <section>
        <div class="section-head">
          <h2>Matchups</h2>
          <label
            ><span class="sr-only">Matrix size</span
            ><select id="limit">
              <option value="8">Top 8 decks</option>
              <option value="12">Top 12 decks</option>
              <option value="all">All decks</option>
            </select></label
          >
        </div>
        <div
          class="scroll matrix-wrap"
          tabindex="0"
          aria-label="Matchup matrix, horizontally scrollable"
        >
          <table id="matrix"></table>
        </div>
        <div id="matchup" hidden></div>
      </section>
      <p id="error" role="alert" hidden></p>
    </div>
</div></main>
