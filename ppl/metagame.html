<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Overall metagame</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="metagame.css?v=art-1"><script type="module" src="metagame.js?v=trim-1"></script></head>
<body><main><nav aria-label="League stats"><a href="/season-standings/">Season standings</a><a href="/ppl/player.html">Player stats</a><a href="/ppl/store.html">Store stats</a><a href="/ppl/metagame.html">Overall metagame</a></nav><h1>Overall metagame</h1><form id="filters"><label>Store<select id="store"><option value="all">All stores</option></select></label><label>From<input id="from" type="date"></label><label>Through<input id="to" type="date"></label><label>Events<select id="kind"><option value="all">All events</option><option value="fnm">FNM only</option></select></label><button type="reset">Reset</button></form><p id="date-error" role="alert" hidden>Choose an end date on or after the start date.</p>

<p id="error" role="alert" hidden></p></main></body></html>
