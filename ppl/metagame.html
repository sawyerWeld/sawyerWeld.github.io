<style>:root {
  --font-family: -apple-system, system-ui, sans-serif;
  --max-width: 70rem;
  --nav-link-color: #BBB;
  --nav-link-hover-color: #FFF;
  --button-color: #00713D;
  --button-hover-color: #069654;
  --table-alt-color: #E8FAEA;
  --img-button-color: #FFF;
  --img-button-hover-color: #EEE;
}

* {
  box-sizing: border-box;
}

html,
body {
  padding: 0;
  margin: 0 auto;
  font-family: var(--font-family);
}
html {
  overflow-y: scroll;
}
body {
  display: flex;
  flex-direction: column;
}

strong {
  font-weight: 550;
}

h1, h2 {
  font-weight: 550;
}

h2 {
  font-size: 1.75rem;
  margin-top: 0.4rem;
  margin-bottom: 0.4rem;
  text-wrap: balance;
}

p {
  margin: 0;
  margin-top: 0.2rem;
  margin-bottom: 0.2rem;
  text-wrap: pretty;
}

a {
  color: blue;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

ul, ol {
  margin-top: 0.2rem;
  margin-bottom: 0.2rem;
}

table {
  border-collapse: collapse;
  width: max-content;
}

.tableDiv {
  overflow-x: scroll;
  padding-bottom: 1rem;
}

td, th {
  padding: .3rem .5rem;
}

td {
  border: 1px solid #ccc;
  text-align: right;
}

.align-left {
  text-align: left;
}

th {
  text-align: right;
  font-weight: 550;
  color: var(--nav-link-color);
  background-color: black;
  border: 1px solid black;
}

.sort {
  transition: color 0.2s ease;
}

.sort:hover {
  color: var(--nav-link-hover-color);
  cursor: pointer;
}

tbody tr:nth-child(even) {
  background-color: var(--table-alt-color);
}

.sort.asc::after {
  content: "\002B06";
  padding-left: 3px;
}
.sort.desc::after {
  content: "\002B07";
  padding-left: 3px
}

.search {
  font-size:1.2rem;
  margin-bottom: 0.5rem;
  width: 12rem;
}

.headline {
  font-size: clamp(2rem, 5.2vw, 4rem);
  text-align: center;
  margin-bottom: 1rem;
  margin-top: 1rem;
  line-height: 1.2;
}

.sub-headline {
  font-size: 1.5rem;
  margin-top: 0.25rem;
  margin-bottom: 1rem;
  text-wrap: balance;
  text-align: center;
}

header {
  box-shadow: 0px 1px 1px #999;
  width: 100%;
  background-color: black;
}

footer {
  box-shadow: 0px -1px 1px #999;
  width: 100%;
  padding-top: 1rem;
  margin-top: 0.8rem;
  margin-bottom: 1rem;
}

.flex-column {
  display: flex;
  flex-direction: column;
}

.flex-row {
  display: flex;
  flex-direction: row;
}

.container {
  margin-inline: auto;
  max-width: var(--max-width);
}

.center-aligned {
  align-items: center;
}

.spread-content {
  justify-content: space-between;
}

.store-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.8rem;
}

.media-span {
  gap: 0.5rem;
}

.navbar {
  justify-content: space-between;
  padding: 0.75rem;
  flex-wrap: wrap;
  gap: 12px;
}

@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    gap: 12px;
  }
}

a.navbar-link {
  font-size: 1rem;
  color: var(--nav-link-color);
  transition: color 0.2s ease;
  text-decoration: none;
}

a.navbar-link:hover,
a.navbar-link[aria-current="page"] {
  text-decoration: none;
  color: var(--nav-link-hover-color);
}

a.navbar-home {
  font-size: 1.5rem;
  text-decoration: none;
  color: white;
}

a.media-link {
  padding: 0.4rem 0.4rem;
  padding-bottom: 0.1rem;
  border-radius: 8px;
  transition: background-color 0.2s ease;
}

a.media-link:hover {
  background-color: var(--img-button-hover-color);
}

.navbar-container {
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 18px;
}

.navbar-toggle {
  display: none;
}

@media (max-width: 760px) {
  .navbar--collapsible {
    position: relative;
    z-index: 20;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
  }

  .navbar--collapsible .navbar-home {
    font-size: 1.2rem;
  }

  .navbar--collapsible .navbar-toggle:not([hidden]) {
    display: inline-flex;
    flex: 0 0 44px;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: white;
    cursor: pointer;
  }

  .navbar-toggle:hover {
    background: #222;
  }

  .navbar-toggle:focus-visible,
  .navbar--collapsible .navbar-link:focus-visible {
    outline: 2px solid #8ab8ff;
    outline-offset: 2px;
  }

  .navbar--collapsible .navbar-container {
    position: absolute;
    top: 100%;
    right: 12px;
    width: 12rem;
    max-width: calc(100% - 24px);
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    justify-content: start;
    gap: 0;
    max-height: calc(100dvh - 68px);
    overflow-y: auto;
    padding: 6px;
    border-radius: 6px;
    background: white;
    border: 1px solid #d9e1ea;
    box-shadow: 0 4px 6px #0003;
  }

  .navbar--collapsible a.navbar-link {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 12px;
    border-radius: 4px;
    color: #182231;
  }

  .navbar--collapsible .navbar-link:hover,
  .navbar--collapsible .navbar-link[aria-current="page"] {
    background: #edf3f8;
  }

  .navbar--collapsible .navbar-link:focus-visible {
    outline-color: #2167ae;
  }

  .navbar--collapsible .navbar-toggle[aria-expanded="false"] + .navbar-container,
  .navbar-toggle[aria-expanded="false"] .navbar-close-icon,
  .navbar-toggle[aria-expanded="true"] .navbar-menu-icon {
    display: none;
  }
}

@media (max-width: 600px) {
  .navbar-container {
    justify-content: center;
  }

  a.navbar-home {
    font-size: 1.2rem;
  }
}

section {
  display: flex;
  flex-direction: column;
  padding-left: 1rem;
  padding-right: 1rem;
  margin-top: 0.6rem;
  margin-bottom: 0.6rem;
}

.store-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  text-align: center;
  background-color: white;
  border: 2px solid var(--button-color);
  color: black;
  font-size: 16px;
  padding: 0.5rem 0.8rem;
  border-radius: 8px;
  transition: background-color 0.2s ease;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.store-card:hover {
  text-decoration: none;
  background-color: var(--img-button-hover-color);
}

.store-card img {
  width: 6rem;
  height: auto;
}

.store-card-logo {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.store-card:focus-visible {
  outline: 2px solid #2167ae;
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .store-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.image {
  width: 50%;
  align-self: center;
  margin-top: 1rem;
  margin-bottom: 1rem;
}

@media (max-width: 600px) {
  .dragonImage {
    width: 75%;
  }
}

      <section>

          <table id="matrix"></table>

        <div id="matchup" hidden></div>
      </section>
      <p id="error" role="alert" hidden></p>
