<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Season Standings Demo</title>
    <link rel="icon" type="image/svg+xml" href="/ppl/favicon.svg" />
    <link rel="stylesheet" href="trophies.css?v=1" />
    <link rel="stylesheet" href="styles.css?v=league-mark-1" />
    <script type="module" src="app.js?v=shared-trophies-1"></script>
  </head>
  <body>
    <a class="skip" href="#standings">Skip to standings</a>
    <main>
      <nav aria-label="League stats">
        <a href="/season-standings/">Season standings</a><a href="/ppl/player.html">Player stats</a
        ><a href="/ppl/store.html">Stores</a><a href="/ppl/metagame.html">Overall metagame</a>
      </nav>
      <header>
        <h1>
          <img class="league-mark" src="/ppl/favicon.svg" alt="" width="858" height="1002" />Season
          Standings Demo
        </h1>
        <label class="search"
          ><span class="sr-only">Find a player</span
          ><input id="search" type="search" placeholder="Find a player" autocomplete="off"
        /></label>
        <p id="dates"></p>
      </header>
      <p id="status" role="alert" hidden></p>
      <section class="panel" id="standings" aria-label="Season standings">
        <div class="table-scroll">
          <table>
            <thead id="head"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="count"></span>
          <div>
            <button id="previous" aria-label="Previous page">←</button
            ><button id="next" aria-label="Next page">→</button>
          </div>
        </div>
      </section>
      <noscript>JavaScript is needed to show the standings.</noscript>
    </main>
    <!-- Ask Luke if we should remove this analytics script when these pages move to the PPL site. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"ed4770c8a20f4c649e2d4689e0e83033"}'
    ></script>
  </body>
</html>
